name: docpipe_monitoring
version: "1.0.0"
config-version: 2
profile: docpipe

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # local run: ../state/logs   |   Azure: az://pipeline-logs/logs (duckdb azure extension)
  logs_path: "../state/logs"
  stale_after_minutes: 120

models:
  docpipe_monitoring:
    staging:
      +materialized: view
    marts:
      +materialized: table
